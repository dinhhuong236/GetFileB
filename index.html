<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Chuẩn - Receiver</title>
<!-- jsQR dùng làm phương án dự phòng trên luồng chính nếu Worker không khởi tạo được -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
    body { font-family: Arial, sans-serif; text-align: center; background: #222; color: white; margin: 0; padding: 15px; }
    button { padding: 12px 20px; margin: 5px; font-size: 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; }
    .btn-stop { background: #dc3545; }
    .btn-gray { background: #666; }

    #video-container { position: relative; display: inline-block; margin-top: 10px; width: 100%; max-width: 400px; border: 2px solid #555; border-radius: 8px; overflow: hidden; line-height: 0; background: #000; }
    video { width: 100%; height: auto; display: block; }

    #roi-box { position: absolute; border: 2px solid #00ff00; box-shadow: 0 0 0 9999px rgba(0,0,0,0.45); pointer-events: none; display: none; }
    #track-box { position: absolute; border: 2px dashed #ffcc00; pointer-events: none; display: none; }

    #progress-container { width: 90%; max-width: 400px; background: #444; margin: 15px auto; height: 25px; border-radius: 12px; overflow: hidden; border: 1px solid #666; }
    #progress-bar { width: 100%; height: 100%; background: #444; }

    #buffer-container { width: 90%; max-width: 400px; background: #333; margin: 8px auto 0; height: 8px; border-radius: 4px; overflow: hidden; }
    #buffer-bar { width: 0%; height: 100%; background: #3fa9f5; transition: width 0.3s; }

    #progress-text { font-weight: bold; font-size: 15px; margin-top: 5px; }
    #missing-frames { color: #ffcc00; font-size: 14px; margin-top: 8px; font-weight: bold; min-height: 20px; word-wrap: break-word; padding: 0 10px; }
    #stats { font-family: monospace; font-size: 12px; color: #aaa; margin-top: 8px; min-height: 16px; white-space: pre-line; }
</style>
</head>
<body>

<h2>Máy Nhận File (QR Chuẩn)</h2>
<button onclick="startCamera()">Mở Camera</button>
<button onclick="stopCamera()" class="btn-stop">Tắt Camera</button>
<button onclick="clearBuffer()" class="btn-gray">Xóa bộ đệm</button>

<h3 id="status" style="color: #ffcc00; margin-bottom: 5px;">Đang chờ camera...</h3>

<div id="progress-container">
    <div id="progress-bar"></div>
</div>
<div id="progress-text">0 / 0 mã QR</div>
<div id="missing-frames">Đưa camera về phía màn hình phát...</div>
<!-- Thanh xanh dương: mức dùng bộ đệm frame -->
<div id="buffer-container"><div id="buffer-bar"></div></div>
<div id="stats"></div>

<div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="roi-box"></div>
    <div id="track-box"></div>
</div>

<script>
// ======================= CẤU HÌNH =======================
const CONFIG = {
    camWidth: 1280,
    camHeight: 720,
    camFps: 60,
    roi: 0.8,                // vùng tìm kiếm hình vuông ở giữa = 80% cạnh ngắn
    searchMaxSize: 640,      // khi chưa tìm thấy mã: vùng tìm kiếm tối đa chừng này pixel

    // --- Bám theo vị trí mã QR: giảm kích thước mỗi frame lưu vào bộ đệm ---
    trackMargin: 0.25,       // nới rộng khung bám thêm 25% mỗi phía (an toàn khi tay hơi rung)
    targetModulePx: 4,       // thu nhỏ sao cho mỗi ô của QR còn ~4px
    trackMaxFails: 8,        // giải mã trượt liên tiếp chừng này frame bám thì quay lại tìm toàn vùng

    // --- Chống trùng ---
    thumbSize: 64,
    dupThreshold: 6,         // chênh lệch trung bình (0-255) dưới mức này = cùng một mã QR
    purgeWindow: 60,         // khi đọc được 1 mã, dọn các frame trùng mã đó trong 60 frame kế tiếp của bộ đệm

    // --- Bộ đệm ---
    maxBufferMB: 256,        // giới hạn bộ nhớ cho bộ đệm; đầy thì tạm dừng ghi tới khi còn 50%

    workers: Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1)),
    nativeConcurrency: 2,
    useNative: true
};
const JSQR_URL = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
const JSQR_OPTS = { inversionAttempts: "dontInvert" };

// Chuyển kết quả jsQR thành { text, box, version }
function jsqrResult(code) {
    if (!code) return { text: null };
    const L = code.location;
    const xs = [L.topLeftCorner.x, L.topRightCorner.x, L.bottomLeftCorner.x, L.bottomRightCorner.x];
    const ys = [L.topLeftCorner.y, L.topRightCorner.y, L.bottomLeftCorner.y, L.bottomRightCorner.y];
    const x = Math.min(...xs), y = Math.min(...ys);
    return { text: code.data, version: code.version, box: { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y } };
}

// Ảnh xám (1 byte/pixel) -> RGBA mà jsQR / BarcodeDetector cần
function grayToRGBA(gray, out) {
    for (let i = 0, j = 0; i < gray.length; i++, j += 4) {
        const v = gray[i];
        out[j] = v; out[j + 1] = v; out[j + 2] = v; out[j + 3] = 255;
    }
    return out;
}

// ======================= MÃ CHO WEB WORKER =======================
const WORKER_SRC = `
let ok = true;
try { importScripts(${JSON.stringify(JSQR_URL)}); } catch (e) { ok = false; }
const jsqrResult = ${jsqrResult.toString()};
const grayToRGBA = ${grayToRGBA.toString()};
let rgba = null;
self.onmessage = (e) => {
    const { buffer, width: w, height: h } = e.data;
    let res = { text: null };
    try {
        const gray = new Uint8Array(buffer);
        if (!rgba || rgba.length !== gray.length * 4) rgba = new Uint8ClampedArray(gray.length * 4);
        res = jsqrResult(jsQR(grayToRGBA(gray, rgba), w, h, { inversionAttempts: "dontInvert" }));
    } catch (err) {}
    res.bw = w; res.bh = h;
    self.postMessage(res);
};
self.postMessage({ ready: ok && typeof jsQR === "function" });
`;

// ======================= BIẾN TOÀN CỤC =======================
const $ = id => document.getElementById(id);
const video = $("video");
const grabCanvas = document.createElement("canvas");
const grabCtx = grabCanvas.getContext("2d", { willReadFrequently: true });
const thumbCanvas = document.createElement("canvas");
thumbCanvas.width = thumbCanvas.height = CONFIG.thumbSize;
const thumbCtx = thumbCanvas.getContext("2d", { willReadFrequently: true });

let stream = null;
let running = false;
let isDownloading = false;
let roi = { x: 0, y: 0, size: 0 };
let vfcId = null, rafId = null, lastVideoTime = -1;

// Bộ đệm frame (FIFO). Mỗi phần tử: { gray, meta, purged }
let buffer = [];
let head = 0;
let bufferBytes = 0;
let bufferCount = 0;
let recordingPaused = false;
const MAX_BYTES = CONFIG.maxBufferMB * 1024 * 1024;

// Bộ giải mã
let decoderMode = null;      // "native" | "worker" | "main"
let detector = null;
let workers = [];
let nativeInFlight = 0;
let mainRGBA = null;

// Bám vị trí + chống trùng
let track = null;
let trackFails = 0;
let lastSuccessThumb = null;

// Dữ liệu file
let currentSession = null;
let completedSession = null;
let totalFrames = 0;
let received = null;
let receivedCount = 0;
let fileChunks = [];
let maxIndexReceived = -1;
let lastText = null;
let renderPending = false;

// Thống kê
const stats = { captured: 0, stored: 0, skipped: 0, purged: 0, decoded: 0, found: 0, lostFull: 0 };
let lastStats = null;
let statsTimer = null;

function setStatus(msg, color = "#ffcc00") {
    $("status").innerText = msg;
    $("status").style.color = color;
}

// ======================= KHỞI TẠO BỘ GIẢI MÃ =======================
async function initDecoders() {
    if (decoderMode) return;

    if (CONFIG.useNative && "BarcodeDetector" in window) {
        try {
            const fmts = await BarcodeDetector.getSupportedFormats();
            if (fmts.includes("qr_code")) {
                detector = new BarcodeDetector({ formats: ["qr_code"] });
                decoderMode = "native";
                return;
            }
        } catch (e) {}
    }

    try {
        const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
        const readyPromises = [];
        for (let i = 0; i < CONFIG.workers; i++) {
            const slot = { w: new Worker(url), busy: false, meta: null };
            readyPromises.push(new Promise(resolve => {
                const timer = setTimeout(() => resolve(false), 8000);
                slot.w.onmessage = (e) => {
                    if ("ready" in e.data) { clearTimeout(timer); resolve(e.data.ready); return; }
                    const meta = slot.meta;
                    slot.busy = false;
                    slot.meta = null;
                    if (meta) handleResult(meta, e.data);
                    pump();
                };
                slot.w.onerror = () => { clearTimeout(timer); slot.busy = false; resolve(false); };
            }));
            workers.push(slot);
        }
        const results = await Promise.all(readyPromises);
        workers = workers.filter((s, i) => results[i]);
        if (workers.length > 0) { decoderMode = "worker"; return; }
    } catch (e) {}

    decoderMode = "main";
}

// ======================= CAMERA =======================
async function startCamera() {
    if (running) stopCamera();
    setStatus("Đang khởi động...");
    await initDecoders();
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: "environment",
                width: { ideal: CONFIG.camWidth },
                height: { ideal: CONFIG.camHeight },
                frameRate: { ideal: CONFIG.camFps }
            }
        });
    } catch (err) {
        setStatus("Lỗi Camera! Hãy mở qua link HTTPS.", "#ff5555");
        return;
    }
    video.srcObject = stream;
    video.onloadedmetadata = async () => {
        try { await video.play(); } catch (e) {}
        updateROI();
        isDownloading = false;
        running = true;
        lastVideoTime = -1;
        scheduleNextFrame();
        startStats();
        setStatus("Đang ghi và giải mã...", "#00ff00");
    };
}

// Tắt camera chỉ dừng GHI; các frame đã lưu trong bộ đệm vẫn tiếp tục được giải mã
function stopCamera() {
    running = false;
    if (vfcId !== null && video.cancelVideoFrameCallback) video.cancelVideoFrameCallback(vfcId);
    if (rafId !== null) cancelAnimationFrame(rafId);
    vfcId = rafId = null;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    $("roi-box").style.display = "none";
    $("track-box").style.display = "none";
    setStatus(bufferCount ? `Đã tắt camera, đang xử lý nốt ${bufferCount} frame...` : "Đã tắt camera.", "#fff");
}

function clearBuffer() {
    buffer = []; head = 0; bufferBytes = 0; bufferCount = 0;
    recordingPaused = false;
    updateBufferBar();
}

function updateROI() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    const size = Math.floor(Math.min(vw, vh) * CONFIG.roi);
    roi = { x: Math.floor((vw - size) / 2), y: Math.floor((vh - size) / 2), size };
    track = null;
    lastSuccessThumb = null;
    placeBox($("roi-box"), roi.x, roi.y, size, size);
}
video.addEventListener("resize", updateROI);

function placeBox(el, x, y, w, h) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    el.style.left = (x / vw * 100) + "%";
    el.style.top = (y / vh * 100) + "%";
    el.style.width = (w / vw * 100) + "%";
    el.style.height = (h / vh * 100) + "%";
    el.style.display = "block";
}

// ======================= GHI FRAME =======================
function scheduleNextFrame() {
    if (!running) return;
    if (video.requestVideoFrameCallback) {
        vfcId = video.requestVideoFrameCallback(() => { captureFrame(); scheduleNextFrame(); });
    } else {
        rafId = requestAnimationFrame(() => {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                captureFrame();
            }
            scheduleNextFrame();
        });
    }
}

function rgbaToGray(d, n) {
    const g = new Uint8Array(n);
    for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
    return g;
}

function makeThumb() {
    const T = CONFIG.thumbSize;
    thumbCtx.drawImage(video, roi.x, roi.y, roi.size, roi.size, 0, 0, T, T);
    return rgbaToGray(thumbCtx.getImageData(0, 0, T, T).data, T * T);
}

function thumbDiff(a, b) {
    let s = 0;
    for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);
    return s / a.length;
}

function getCaptureRegion() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (track) {
        const m = Math.max(track.w, track.h) * CONFIG.trackMargin;
        const sx = Math.max(0, Math.floor(track.x - m));
        const sy = Math.max(0, Math.floor(track.y - m));
        const sw = Math.min(vw - sx, Math.ceil(track.w + 2 * m));
        const sh = Math.min(vh - sy, Math.ceil(track.h + 2 * m));
        const scale = track.module ? Math.min(1, CONFIG.targetModulePx / track.module) : 1;
        return { sx, sy, sw, sh, dw: Math.max(1, Math.round(sw * scale)), dh: Math.max(1, Math.round(sh * scale)), tracked: true };
    }
    const s = roi.size;
    const d = Math.min(s, CONFIG.searchMaxSize);
    return { sx: roi.x, sy: roi.y, sw: s, sh: s, dw: d, dh: d, tracked: false };
}

function captureFrame() {
    if (!running || isDownloading || video.readyState < 2 || !roi.size) return;
    stats.captured++;

    // Bộ đệm đầy: tạm dừng ghi (frame này mất) cho tới khi bộ đệm còn 50%
    if (recordingPaused) {
        if (bufferBytes < MAX_BYTES / 2) recordingPaused = false;
        else { stats.lostFull++; return; }
    }

    // Màn hình vẫn đang hiện đúng mã vừa đọc được -> không cần lưu
    const thumb = makeThumb();
    if (lastSuccessThumb && thumbDiff(thumb, lastSuccessThumb) < CONFIG.dupThreshold) {
        stats.skipped++;
        return;
    }

    // Chụp vùng cần giải mã, chuyển sang ảnh xám 1 byte/pixel (nhẹ hơn RGBA 4 lần) rồi cất vào bộ đệm
    const meta = getCaptureRegion();
    meta.thumb = thumb;
    if (grabCanvas.width !== meta.dw || grabCanvas.height !== meta.dh) {
        grabCanvas.width = meta.dw;
        grabCanvas.height = meta.dh;
    }
    grabCtx.drawImage(video, meta.sx, meta.sy, meta.sw, meta.sh, 0, 0, meta.dw, meta.dh);
    const gray = rgbaToGray(grabCtx.getImageData(0, 0, meta.dw, meta.dh).data, meta.dw * meta.dh);

    buffer.push({ gray, meta, purged: false });
    bufferBytes += gray.length + thumb.length;
    bufferCount++;
    stats.stored++;
    if (bufferBytes >= MAX_BYTES) recordingPaused = true;
    pump();
}

// ======================= LẤY FRAME TỪ BỘ ĐỆM ĐI GIẢI MÃ =======================
function takeFromBuffer() {
    while (head < buffer.length) {
        const item = buffer[head];
        buffer[head++] = undefined;
        if (head > 1024 && head * 2 > buffer.length) { buffer = buffer.slice(head); head = 0; }
        if (item.purged) continue;            // đã bị dọn vì trùng (đã trừ bộ nhớ lúc dọn)
        bufferBytes -= item.gray.length + item.meta.thumb.length;
        bufferCount--;
        return item;
    }
    return null;
}

function hasBuffered() { return bufferCount > 0; }

function pump() {
    while (hasBuffered() && !isDownloading) {
        if (decoderMode === "native") {
            if (nativeInFlight >= CONFIG.nativeConcurrency) return;
            const item = takeFromBuffer();
            if (!item) return;
            const { dw: w, dh: h } = item.meta;
            const img = new ImageData(grayToRGBA(item.gray, new Uint8ClampedArray(w * h * 4)), w, h);
            nativeInFlight++;
            detector.detect(img)
                .then(codes => {
                    const c = codes[0];
                    handleResult(item.meta, c
                        ? { text: c.rawValue, bw: w, bh: h, box: { x: c.boundingBox.x, y: c.boundingBox.y, w: c.boundingBox.width, h: c.boundingBox.height } }
                        : { text: null });
                })
                .catch(() => handleResult(item.meta, { text: null }))
                .finally(() => { nativeInFlight--; pump(); });
        } else if (decoderMode === "worker") {
            const slot = workers.find(s => !s.busy);
            if (!slot) return;
            const item = takeFromBuffer();
            if (!item) return;
            slot.busy = true;
            slot.meta = item.meta;
            slot.w.postMessage({ buffer: item.gray.buffer, width: item.meta.dw, height: item.meta.dh }, [item.gray.buffer]);
        } else {
            const item = takeFromBuffer();
            if (!item) return;
            const { dw: w, dh: h } = item.meta;
            if (!mainRGBA || mainRGBA.length !== w * h * 4) mainRGBA = new Uint8ClampedArray(w * h * 4);
            const res = jsqrResult(jsQR(grayToRGBA(item.gray, mainRGBA), w, h, JSQR_OPTS));
            res.bw = w; res.bh = h;
            handleResult(item.meta, res);
            if (hasBuffered()) setTimeout(pump, 0);
            return;
        }
    }
}

// Đọc được 1 mã -> dọn các frame kế tiếp trong bộ đệm có cùng hình ảnh (cùng mã, khỏi giải mã lại)
function purgeDuplicates(thumb) {
    let checked = 0;
    for (let i = head; i < buffer.length && checked < CONFIG.purgeWindow; i++) {
        const it = buffer[i];
        if (!it || it.purged) continue;
        checked++;
        if (thumbDiff(it.meta.thumb, thumb) < CONFIG.dupThreshold) {
            it.purged = true;
            bufferBytes -= it.gray.length + it.meta.thumb.length;
            bufferCount--;
            it.gray = null;
            stats.purged++;
        }
    }
}

function handleResult(meta, res) {
    stats.decoded++;
    if (res.text) {
        stats.found++;
        lastSuccessThumb = meta.thumb;
        trackFails = 0;
        purgeDuplicates(meta.thumb);
        if (res.box && res.bw) {
            const kx = meta.sw / res.bw, ky = meta.sh / res.bh;
            const x = meta.sx + res.box.x * kx, y = meta.sy + res.box.y * ky;
            const w = res.box.w * kx, h = res.box.h * ky;
            const modules = res.version ? 17 + 4 * res.version : null;
            const module = modules ? Math.min(w, h) / modules : (track ? track.module : null);
            track = { x, y, w, h, module };
            if (running) placeBox($("track-box"), x, y, w, h);
        }
        onText(res.text);
    } else if (meta.tracked && track) {
        if (++trackFails >= CONFIG.trackMaxFails) {
            track = null;
            trackFails = 0;
        }
    }
    if (!track) $("track-box").style.display = "none";
}

// ======================= XỬ LÝ DỮ LIỆU QR =======================
function onText(text) {
    if (text === lastText) return;
    lastText = text;
    let p;
    try { p = JSON.parse(text); } catch (e) { return; }
    if (!p || typeof p.d !== "string" || !Number.isInteger(p.s) || !Number.isInteger(p.t) || p.t <= 0 || p.s < 0 || p.s >= p.t) return;
    handleValidPayload(p);
}

function handleValidPayload(payload) {
    if (payload.i === completedSession || isDownloading) return;

    if (currentSession !== payload.i) {
        currentSession = payload.i;
        totalFrames = payload.t;
        received = new Uint8Array(totalFrames);
        receivedCount = 0;
        fileChunks = new Array(totalFrames);
        maxIndexReceived = -1;
    }

    if (received[payload.s]) return;
    received[payload.s] = 1;
    receivedCount++;
    fileChunks[payload.s] = payload.d;
    if (payload.s > maxIndexReceived) maxIndexReceived = payload.s;

    scheduleRender();

    if (receivedCount === totalFrames) {
        isDownloading = true;
        clearBuffer();
        render();
        setStatus("Đang lưu file vào máy...", "#00ff00");
        assembleAndDownload(payload.n, payload.i);
    }
}

// ======================= GIAO DIỆN =======================
function scheduleRender() {
    if (renderPending) return;
    renderPending = true;
    requestAnimationFrame(() => { renderPending = false; render(); });
}

function render() {
    if (!totalFrames) return;

    const step = 100 / totalFrames;
    const stops = [];
    let lastColor = null, start = 0;
    for (let i = 0; i <= totalFrames; i++) {
        let color = null;
        if (i < totalFrames) {
            color = received[i] ? "#00ff00" : (i < maxIndexReceived ? "#ff3333" : "#444");
        }
        if (color !== lastColor) {
            if (lastColor !== null) stops.push(`${lastColor} ${(start * step).toFixed(2)}% ${(i * step).toFixed(2)}%`);
            lastColor = color;
            start = i;
        }
    }
    $("progress-bar").style.background = `linear-gradient(to right, ${stops.join(", ")})`;
    $("progress-text").innerText = `${receivedCount} / ${totalFrames} mã QR`;

    const missingCount = totalFrames - receivedCount;
    const mf = $("missing-frames");
    if (missingCount > 0) {
        const list = [];
        for (let i = 0; i < totalFrames && list.length < 15; i++) if (!received[i]) list.push(i + 1);
        let txt = list.join(", ");
        if (missingCount > 15) txt += `... (+${missingCount - 15} mã nữa)`;
        mf.innerText = `Còn thiếu ${missingCount} mã số: [${txt}]`;
        mf.style.color = "#ff3333";
    } else {
        mf.innerText = "Đã thu thập đủ 100%!";
        mf.style.color = "#00ff00";
    }
}

function updateBufferBar() {
    const pct = Math.min(100, bufferBytes / MAX_BYTES * 100);
    const bar = $("buffer-bar");
    bar.style.width = pct.toFixed(1) + "%";
    bar.style.background = recordingPaused ? "#ff3333" : "#3fa9f5";
}

function startStats() {
    if (statsTimer) return;   // chạy suốt, kể cả khi đã tắt camera mà bộ đệm còn frame
    lastStats = { ...stats, t: performance.now() };
    statsTimer = setInterval(() => {
        const now = performance.now();
        const dt = (now - lastStats.t) / 1000;
        const rate = k => ((stats[k] - lastStats[k]) / dt).toFixed(0);
        const tr = stream && stream.getVideoTracks()[0];
        const s = tr && tr.getSettings ? tr.getSettings() : {};
        const modeName = decoderMode === "native" ? "Native" : decoderMode === "worker" ? `jsQR x${workers.length} luồng` : "jsQR luồng chính";
        const mb = (bufferBytes / 1048576).toFixed(1);
        const line1 = `${s.width || "-"}x${s.height || "-"}@${s.frameRate ? Math.round(s.frameRate) : "-"} | ${modeName} | Bám: ${track ? "có" : "không"}`;
        const line2 = `Bắt ${rate("captured")} | Lưu ${rate("stored")} | Trùng ${rate("skipped")}+${rate("purged")} | Giải mã ${rate("decoded")} | Đọc được ${rate("found")} /s`;
        const line3 = `Bộ đệm: ${bufferCount} frame (${mb} MB)${recordingPaused ? " - ĐẦY, TẠM DỪNG GHI" : ""} | Mất do đầy: ${stats.lostFull}`;
        $("stats").innerText = `${line1}\n${line2}\n${line3}`;
        updateBufferBar();
        if (!running && !isDownloading && totalFrames && receivedCount < totalFrames) {
            setStatus(bufferCount ? `Đã tắt camera, đang xử lý nốt ${bufferCount} frame...` : "Đã tắt camera.", "#fff");
        }
        lastStats = { ...stats, t: now };
    }, 1000);
}

// ======================= GHÉP FILE =======================
function assembleAndDownload(fileName, sessionId) {
    try {
        const binary = atob(fileChunks.join(""));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

        const url = URL.createObjectURL(new Blob([bytes]));
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName || "received_file";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);

        fileChunks = [];
        completedSession = sessionId;
        setStatus("✅ Đã tải xong: " + (fileName || "received_file"), "#00ff00");
        setTimeout(() => alert("Tải file thành công!"), 500);
    } catch (err) {
        setStatus("❌ Lỗi giải mã file!", "#ff5555");
    }
    isDownloading = false;
}
