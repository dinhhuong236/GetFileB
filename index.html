

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>QR Chuẩn - Sender</title>
<!-- Tải thư viện tạo QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f3f3f3; margin: 20px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; }
    #status { margin-top: 10px; font-size: 18px; font-weight: bold; color: #333; }
    /* Căn giữa mã QR */
    #qrcode-container {
        display: flex; justify-content: center; align-items: center;
        margin-top: 20px;
    }
    #qrcode { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
</style>
</head>
<body>

<h2>Máy Phát File qua QR Code Chuẩn</h2>
<input type="file" id="fileInput"><br><br>
<button onclick="prepare()">1. Chuẩn bị</button>
<button onclick="start()">2. Phát</button>
<button onclick="stop()">3. Dừng</button>
<div id="status">Vui lòng chọn file...</div>

<div id="qrcode-container">
    <div id="qrcode"></div>
</div>

<script>
// Giảm dung lượng mỗi mảnh xuống để mã QR không bị quá đặc (quá đặc sẽ khó quét)
const CHUNK_SIZE = 250; 
const FRAME_RATE = 5; // Tốc độ 5 khung hình/giây

let packets = [];
let frameIndex = 0;
let loopCount = 1;
let timer = null;
let qrCodeObj = null;

function setStatus(msg) { document.getElementById("status").innerText = msg; }
function randomSession() { return Math.random().toString(36).substring(2, 10); }

function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
    });
}

async function prepare() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Vui lòng chọn file!");
    stop();
    setStatus("Đang đóng gói dữ liệu...");

    try {
        const base64 = await readFileAsBase64(file);
        const sid = randomSession();
        packets = [];
        const total = Math.ceil(base64.length / CHUNK_SIZE);

        for (let i = 0; i < total; i++) {
            packets.push(JSON.stringify({
                i: sid, s: i, t: total, n: file.name, z: file.size,
                d: base64.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE)
            }));
        }

        setStatus(`Chuẩn bị xong! Tổng: ${packets.length} mã QR.`);
        frameIndex = 0; loopCount = 1;

        // Khởi tạo bộ vẽ QR
        if (!qrCodeObj) {
            qrCodeObj = new QRCode(document.getElementById("qrcode"), {
                width: 400,
                height: 400,
                correctLevel: QRCode.CorrectLevel.L // Mức sửa lỗi thấp để QR thưa, dễ quét
            });
        }
        qrCodeObj.makeCode(packets[0]);

    } catch (err) { setStatus("Lỗi đọc file!"); }
}

function start() {
    if (packets.length === 0) return alert("Vui lòng Chuẩn bị trước!");
    stop();
    timer = setInterval(() => {
        qrCodeObj.makeCode(packets[frameIndex]);
        setStatus(`Đang phát (Vòng ${loopCount}): ${frameIndex + 1} / ${packets.length} QR`);
        
        frameIndex++;
        if (frameIndex >= packets.length) { frameIndex = 0; loopCount++; }
    }, 1000 / FRAME_RATE);
}

function stop() { 
    if (timer) { clearInterval(timer); timer = null; setStatus("Đã tạm dừng."); } 
}
</script>
</body>
</html>
