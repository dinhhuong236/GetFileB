<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Chuẩn - Receiver</title>
<!-- Tải thư viện quét QR Code siêu tốc -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
    body { font-family: Arial, sans-serif; text-align: center; background: #222; color: white; margin: 0; padding: 15px; }
    button { padding: 12px 20px; margin: 5px; font-size: 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; }
    .btn-stop { background: #dc3545; }
    
    #video-container { position: relative; display: inline-block; margin-top: 10px; width: 100%; max-width: 400px; }
    video { width: 100%; height: auto; border: 2px solid #555; border-radius: 8px; background: #000; }
    
    #scan-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        box-shadow: inset 0 0 0 40px rgba(0,0,0,0.5); pointer-events: none;
    }
    
    #progress-container { width: 90%; max-width: 400px; background: #444; margin: 15px auto; height: 25px; border-radius: 12px; overflow: hidden; border: 1px solid #666; }
    
    /* Progress bar giờ chiếm 100% chiều dài, ta sẽ dùng JS để tô màu background (Xanh/Đỏ/Xám) */
    #progress-bar { width: 100%; height: 100%; background: #444; }
    
    #progress-text { font-weight: bold; font-size: 15px; margin-top: 5px;}
    #missing-frames { color: #ffcc00; font-size: 14px; margin-top: 8px; font-weight: bold; min-height: 20px; word-wrap: break-word; padding: 0 10px;}
    canvas { display: none; }
</style>
</head>
<body>

<h2>Máy Nhận File (QR Chuẩn)</h2>
<button onclick="startCamera()">Mở Camera</button>
<button onclick="stopCamera()" class="btn-stop">Tắt Camera</button>

<h3 id="status" style="color: #ffcc00; margin-bottom: 5px;">Đang chờ camera...</h3>

<div id="progress-container">
    <div id="progress-bar"></div>
</div>
<div id="progress-text">0 / 0 mã QR</div>
<div id="missing-frames">Đưa camera về phía màn hình phát...</div>

<div id="video-container">
    <video id="video" autoplay playsinline></video>
    <div id="scan-overlay"></div>
</div>

<canvas id="canvas"></canvas>

<script>
let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d", { willReadFrequently: true });
let scanInterval = null;
let stream = null;

let currentSession = null;
let receivedChunks = new Set();
let fileChunks = [];
let totalFrames = 0;
let isDownloading = false;
let maxIndexReceived = -1; // Biến mới để biết ta đã quét tới frame xa nhất là bao nhiêu

function setStatus(msg, color = "#ffcc00") {
    document.getElementById("status").innerText = msg;
    document.getElementById("status").style.color = color;
}

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            video.play();
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            startScanning();
            setStatus("Đang quét siêu tốc...", "#00ff00");
        };
    } catch (err) {
        setStatus("Lỗi Camera! Hãy mở qua link HTTPS.", "#ff5555");
    }
}

function stopCamera() {
    if (stream) stream.getTracks().forEach(track => track.stop());
    if (scanInterval) cancelAnimationFrame(scanInterval);
    setStatus("Đã tắt camera.", "#fff");
}

function startScanning() {
    isDownloading = false;
    
    function scanFrame() {
        if (!stream || isDownloading) return;
        
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height, {
            inversionAttempts: "dontInvert", 
        });

        if (code) {
            try {
                const payload = JSON.parse(code.data);
                handleValidPayload(payload);
            } catch(e) { }
        }

        scanInterval = requestAnimationFrame(scanFrame);
    }
    scanFrame();
}

function handleValidPayload(payload) {
    if (currentSession !== payload.i) {
        currentSession = payload.i;
        totalFrames = payload.t;
        receivedChunks = new Set();
        fileChunks = new Array(totalFrames);
        maxIndexReceived = -1; // Đặt lại vị trí xa nhất mỗi khi quét file mới
    }

    if (!receivedChunks.has(payload.s)) {
        receivedChunks.add(payload.s);
        fileChunks[payload.s] = payload.d; 
        
        // Cập nhật vị trí mã xa nhất đã nhận được để biết mã nào bị bỏ sót
        if (payload.s > maxIndexReceived) {
            maxIndexReceived = payload.s;
        }

        // --- CẬP NHẬT BẢN ĐỒ MÀU CHO THANH PROGRESS BAR ---
        let gradientStops = [];
        let step = 100 / totalFrames;
        let lastColor = null;
        let startPct = 0;

        for (let i = 0; i <= totalFrames; i++) {
            let color = "#444"; // Mặc định: Chưa quét tới (màu như cũ)
            if (i < totalFrames) {
                if (receivedChunks.has(i)) {
                    color = "#00ff00"; // Thành công (Màu xanh lá)
                } else if (i < maxIndexReceived) {
                    color = "#ff3333"; // Đã vượt qua nhưng không nhận được -> Bỏ sót (Màu đỏ)
                }
            } else {
                color = null; // Kết thúc vòng lặp
            }

            // Tối ưu css bằng cách gộp các dải màu giống nhau nằm liền kề
            if (color !== lastColor) {
                if (lastColor !== null) {
                    let endStr = (i * step).toFixed(2);
                    let startStr = startPct.toFixed(2);
                    gradientStops.push(`${lastColor} ${startStr}% ${endStr}%`);
                    startPct = i * step;
                }
                lastColor = color;
            }
        }
        
        // Cập nhật giao diện thanh bar
        document.getElementById("progress-bar").style.background = `linear-gradient(to right, ${gradientStops.join(", ")})`;
        document.getElementById("progress-text").innerText = `${receivedChunks.size} / ${totalFrames} mã QR`;

        // Tính số mã bị thiếu hiển thị dưới dạng văn bản (để phụ trợ thêm nếu cần)
        let missingCount = totalFrames - receivedChunks.size;
        if (missingCount > 0) {
            let missingList = [];
            for (let i = 0; i < totalFrames; i++) {
                if (!receivedChunks.has(i)) missingList.push(i + 1); 
            }
            let displayMissing = missingList.slice(0, 15).join(", ");
            if (missingList.length > 15) displayMissing += `... (+${missingList.length - 15} mã nữa)`;

            document.getElementById("missing-frames").innerText = `Còn thiếu ${missingCount} mã số: [${displayMissing}]`;
            document.getElementById("missing-frames").style.color = "#ff3333"; 
        } else {
            document.getElementById("missing-frames").innerText = "Đã thu thập đủ 100%!";
            document.getElementById("missing-frames").style.color = "#00ff00"; 
        }

        if (receivedChunks.size === totalFrames) {
            isDownloading = true; 
            setStatus("Đang lưu file vào máy...", "#00ff00");
            assembleAndDownload(payload.n);
        }
    }
}

function assembleAndDownload(fileName) {
    try {
        const fullBase64 = fileChunks.join("");
        
        const binaryString = atob(fullBase64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        
        const blob = new Blob([bytes]);
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        fileChunks = []; 
        setStatus("✅ Đã tải xong: " + fileName, "#00ff00");
        setTimeout(() => alert("Tải file thành công!"), 500);
        
    } catch (err) {
        setStatus("❌ Lỗi giải mã file!", "#ff5555");
    }
}
</script>
</body>
</html>
